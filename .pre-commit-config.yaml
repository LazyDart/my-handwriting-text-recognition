# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.8
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix  ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/facebook/pyrefly-pre-commit
  rev: 1.4.0.dev1  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  hooks:
    - id: pyrefly-check
      name: Pyrefly (type checking)
      pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
      language: system  # Use system-installed pyrefly